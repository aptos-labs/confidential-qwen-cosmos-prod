          image_ref="$IMAGE_NAME@$DIGEST"
          docker pull "$image_ref"
          python3 scripts/smoke_image.py "$SMOKE_KIND" "$image_ref"
          printf '\nPublished and smoke-tested: `%s`\n' "$image_ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the actual workflow source and published digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  anonymous_pull:
    name: Release gate - anonymous digest pulls
    # A fresh GitHub-hosted runner, NOT a step on either logged-in builder.
    # No packages permission/token, no login action, no shared Docker config/cache.
    needs: [gateway, qwen]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      GATEWAY_IMAGE: ghcr.io/aptos-labs/confidential-qwen-cosmos-paid-gateway
      QWEN_IMAGE: ghcr.io/aptos-labs/confidential-qwen-cosmos-qwen-metered
      GATEWAY_DIGEST: ${{ needs.gateway.outputs.digest }}
      QWEN_DIGEST: ${{ needs.qwen.outputs.digest }}
      # This runner retains both pulls: gateway 4 GiB + Qwen 24 GiB.
      MIN_FREE_GIB: '28'
    steps:
      - name: Check out the same reviewed smoke script
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind checkout, workflow, and main ancestry to the reviewed SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::source_sha must be a full lowercase 40-character commit SHA.'
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$SOURCE_SHA" || "$SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::Require checkout HEAD == SOURCE_SHA == GITHUB_SHA; dispatch on the reviewed commit.'
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo '::error::The reviewed source must be an ancestor of origin/main.'
            exit 1
          fi
          printf 'sha=%s\n' "$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Create an empty anonymous Docker configuration
        id: anonymous_config
        shell: bash
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d "$RUNNER_TEMP/anonymous-docker.XXXXXX")"
          chmod 700 "$anonymous_config"
          test -z "$(ls -A "$anonymous_config")"
          printf 'DOCKER_CONFIG=%s\n' "$anonymous_config" >> "$GITHUB_ENV"
          # An inherited context/host or auth JSON must not redirect/authenticate pulls.
          printf 'DOCKER_AUTH_CONFIG=\nDOCKER_CONTEXT=\nDOCKER_HOST=\n' >> "$GITHUB_ENV"
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          ### Anonymous release gate
          Both published digests must pull and pass smoke without registry credentials.
          New GHCR packages may be private: an owner must change each package's visibility
          to **Public** in the GitHub package settings UI and rerun this workflow.
          Any gate failure keeps release blocked. A tag or an authenticated pull is not proof.
          This workflow does not create a Tinfoil release or deploy anything.
          TEXT

      - name: Require free disk for both anonymous pulls
        id: disk
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import shutil
          import sys

          required = int(os.environ["MIN_FREE_GIB"]) * 1024**3
          paths = ("/var/lib/docker", os.environ["GITHUB_WORKSPACE"], os.environ["RUNNER_TEMP"])
          for path in paths:
              free = shutil.disk_usage(path).free
              print(f"{path}: {free / 1024**3:.2f} GiB free; need {required / 1024**3:g} GiB")
              if free < required:
                  print("::error::Insufficient disk. Release blocked; do not remove preinstalled tools to bypass this gate.")
                  sys.exit(1)
          PY

      - name: Anonymously pull and smoke both exact output digests
        id: anonymous_smoke
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOCKER_CONFIG"
          test -d "$DOCKER_CONFIG"
          test -z "$(ls -A "$DOCKER_CONFIG")"
          [[ "$GATEWAY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::Invalid gateway digest'; exit 1; }
          [[ "$QWEN_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::Invalid Qwen digest'; exit 1; }
          gateway_ref="$GATEWAY_IMAGE@$GATEWAY_DIGEST"
          qwen_ref="$QWEN_IMAGE@$QWEN_DIGEST"
          docker pull "$gateway_ref"
          python3 scripts/smoke_image.py gateway "$gateway_ref"
          docker pull "$qwen_ref"
          python3 scripts/smoke_image.py qwen "$qwen_ref"
          printf '\nAnonymous digest verification passed for both:\n- `%s`\n- `%s`\n' \
            "$gateway_ref" "$qwen_ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep release blocked when verification fails
        if: ${{ failure() }}
        shell: bash
        run: |
          echo '::error::Anonymous verification failed. Release remains blocked. For private packages, an owner must set visibility to Public in the GHCR UI, then rerun this workflow.'
          echo '## BLOCKED: anonymous digest verification did not pass; do not release or deploy.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

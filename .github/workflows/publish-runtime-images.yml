        id: test
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: ${{ env.IMAGE_CONTEXT }}
          target: test
          platforms: linux/amd64
          no-cache: true
          push: false
          load: false
          provenance: false

      - name: Log in for publication only after tests pass
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the tested source runtime
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: ${{ env.IMAGE_CONTEXT }}
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: mode=max
          # The source tag is a locator, NEVER proof of the image that passed smoke.
          tags: ${{ env.IMAGE_NAME }}:source-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.base.name=${{ steps.metadata.outputs.base_image }}
            org.opencontainers.image.base.digest=${{ steps.metadata.outputs.base_digest }}

